---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

# Release tags run the same tests in the Release workflow before anything is
# published.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ forgejo.ref }}-${{ forgejo.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: https://github.com/jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install frontend dependencies
        run: mise run frontend-install

      - name: Check Rust formatting
        run: mise run fmt-check

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build frontend
        run: mise run frontend-build

  image:
    name: image
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: https://github.com/jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Read tool versions
        id: versions
        run: |
          echo "rust=$(mise config get tools.rust.version)" >> "$GITHUB_OUTPUT"
          echo "node=$(mise config get tools.node)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            RUST_VERSION=${{ steps.versions.outputs.rust }}
            NODE_VERSION=${{ steps.versions.outputs.node }}
