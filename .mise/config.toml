# mise is the project toolchain source of truth. Run `mise tasks` to discover
# the same build, test, lint, and image commands used by CI.

[tools]
rust = { version = "1.100.0", components = "clippy,rustfmt" }
node = "26.13.1"
lefthook = "2.2.2"
oxfmt = "0.79.0"

[tasks.build]
description = "Build the backend and the frontend"
depends = ["backend-build", "frontend-build"]

[tasks.backend-build]
description = "Compile the backend"
dir = "backend"
run = "cargo build --locked"

[tasks.frontend-install]
description = "Install frontend dependencies from the lockfile"
dir = "frontend"
run = "npm ci --no-audit --no-fund"

[tasks.frontend-build]
description = "Build the frontend"
dir = "frontend"
depends = ["frontend-install"]
run = "npm run build"

[tasks.test]
description = "Run the backend and frontend tests"
run = ["cd backend && cargo test --locked", "cd frontend && npm test --if-present"]

[tasks.fmt]
description = "Format Rust sources"
dir = "backend"
run = "cargo fmt"

[tasks.fmt-check]
description = "Verify Rust formatting"
dir = "backend"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy and the TypeScript typecheck"
run = [
  "cd backend && cargo clippy --locked --all-targets -- -D warnings",
  "cd frontend && npx tsc --noEmit",
]

[tasks.oxfmt]
description = "Format YAML, JSON, Markdown, and other non-source project files"
run = "oxfmt --write ."

[tasks.oxfmt-check]
description = "Verify non-source project formatting"
run = "oxfmt --check ."

[tasks.dev]
description = "Run the backend and frontend locally (reads .env when present)"
run = ["cd backend && cargo build --features dotenv", "cd frontend && npm run dev"]

[tasks.docker-build]
description = "Build the container image for this machine"
run = "docker build --build-arg RUST_VERSION=$(mise config get tools.rust.version) --build-arg NODE_VERSION=$(mise config get tools.node) --tag unleashed-voucher-manager ."

[tasks.docker-run]
description = "Run the published image with Docker Compose"
run = "docker compose up"

[hooks]
postinstall = "lefthook install"
